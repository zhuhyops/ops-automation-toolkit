# ==========================================================
# 描述: 企业级轻量级 K8s (K3s) 业务部署清单
# 包含: Deployment (副本控制/资源限制) + Service (内部负载均衡)
# ==========================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
  labels:
    app: web-app
spec:
  replicas: 3  # 维持3个副本，实现高可用
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: nginx-server
        image: nginx:1.21-alpine
        ports:
        - containerPort: 80
        # 核心：资源配额限制 (防止单个容器耗尽系统资源)
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        # 健康检查：确保业务不可用时自动重启 Pod
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: web-app-service
spec:
  selector:
    app: web-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP # 仅集群内部访问
